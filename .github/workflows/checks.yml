# Checks on every pull request and every push to main (maintainer, 2026-10-06).
# Lesson folders (C:\OET) are not here, so nothing that needs them runs; the
# before/after render proof stays a local check (docs/03-RUNBOOK.md).
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # The project's requirements, so CI tests the owner's setup (owner, 2026-10-12)
      - name: Install the requirements
        run: python -m pip install -r requirements.txt
      # ADR 039 amendment of 2026-10-23: the publish step's tests need ffmpeg and the
      # pinned contracts. The contracts release is private (oetacademy-web); with
      # a token that reads it, it is downloaded and its SHA-256 checked against
      # spike/publish/contracts.lock.json. Since 2026-11-09 (the owner, #194: the tests
      # went stale while CI skipped them) a token is required: EXERCISES_RELEASES_TOKEN
      # reads oetacademy-web too (the owner's choice), CONTRACTS_READ_TOKEN first if
      # set. Without one the job fails rather than skip, as the release-answers job does.
      # The runner has no ffmpeg. The apt one (6.1) decodes an AAC file without the edit list's
      # end trim, about 20 ms long, so the publish step's length check fails on files that pass
      # with the owner's ffmpeg 9.0 (2026-11-09, #194). CI uses a static 9.0 build instead.
      - name: ffmpeg
        timeout-minutes: 5
        run: |
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          name=ffmpeg-n9.0-latest-linux64-gpl-9.0
          curl -fsSL --retry 3 "$base/$name.tar.xz" -o "$RUNNER_TEMP/ffmpeg.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/$name/bin/ffmpeg" -version | head -1
      - name: Pinned contracts
        env:
          GH_TOKEN: ${{ secrets.CONTRACTS_READ_TOKEN || secrets.EXERCISES_RELEASES_TOKEN }}
          OETBOOK_CONTRACTS_DIR: ${{ runner.temp }}/contracts
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::no token reads the contracts (EXERCISES_RELEASES_TOKEN); the publish tests cannot run"
            exit 1
          fi
          python spike/scripts/lesson_package.py --fetch
      - name: Every script compiles
        run: python -m compileall -q spike/scripts spike/tests
      - name: Unit tests
        env:
          OETBOOK_CONTRACTS_DIR: ${{ runner.temp }}/contracts
        run: python -m unittest discover -s spike/tests -v
      # ADR 038: the public course index lists every built lesson (each has an
      # entry in spike/course_index/curated.json), matches its schema, and its
      # Markdown is generated from its JSON. Whether it is up to date with the
      # lesson data is checked where the lessons are (--check, the runner).
      - name: Public course index
        run: python spike/scripts/build_public_course_index.py --verify

  release-answers:
    # ADR 026: no answer of a practice set in this public repository. The
    # releases are private: EXERCISES_RELEASES_TOKEN is a read-only token for
    # siamingit/oetacademy-exercises. Without it (a fork's pull request) the
    # job fails rather than pass unchecked. The check never prints an answer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download every exercises release
        env:
          GH_TOKEN: ${{ secrets.EXERCISES_RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret EXERCISES_RELEASES_TOKEN is not set; the answers cannot be checked"
            exit 1
          fi
          repo=siamingit/oetacademy-exercises
          tags=$(gh release list -R "$repo" --limit 1000 --json tagName --jq '.[].tagName')
          [ -n "$tags" ] || { echo "::error::no release found in $repo"; exit 1; }
          for tag in $tags; do
            dir="$RUNNER_TEMP/releases/$tag"
            mkdir -p "$dir"
            if ! gh release download "$tag" -R "$repo" -p package.json -D "$dir" 2>/dev/null; then
              # a release with the zipped package only
              gh release download "$tag" -R "$repo" -p '*.zip' -D "$dir"
              unzip -q -o -j "$dir"/*.zip '*/package.json' -d "$dir"
            fi
            echo "$tag: $(ls "$dir"/package.json)"
          done
      - name: No answer in a committed file
        run: python spike/scripts/check_release_answers.py "$RUNNER_TEMP"/releases/*/package.json
