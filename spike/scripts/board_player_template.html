<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* The lesson frame, injected from write_screens.py so the player and the
   previews draw a block identically. */
/*__FRAME_CSS__*/

/* Player: the frame fills the viewport (docs/02-DESIGN-SYSTEM.md §1), the
   control band grows to keep every control at 44px on touch (§9), and the
   marks are the re-authored marks of §8. Everything is a share of the frame. */
html, body { margin: 0; height: 100%; background: #f4f3ef; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center;
       gap: 10px; padding: 12px; box-sizing: border-box;
       font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #4a4944; }
.frame { display: flex; flex-direction: column; border: 1px solid #d6d4cc; flex: none; }
/* flex: none: the frame keeps its 16:9 size. It used to shrink when the review
   subtitle under it wrapped to more lines, and every size in it (a share of
   its height) changed with it: every word moved (2026-09-26). */
.frame .hdr { flex: none; justify-content: space-between; }
.frame .hdr .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frame .body { flex: 1; height: auto; min-height: 0; }
.frame .ctl { flex: none; height: max(8cqh, 44px); }
:fullscreen .frame, .frame:fullscreen { border: none; }

.blk { opacity: 0; transition: opacity .25s ease; }
.blk.pin-later { display: none; }
/* a working block cleared inside its state (bundle 1.8, state `clears`) */
.blk.cleared { display: none; }
.blk.on { opacity: 1; }

/* The camera: everything on the board sits in #cam, which a table board zooms
   onto the active cell when the table's text on screen is under 14px
   (docs/02-DESIGN-SYSTEM.md §7, "Tables"). Otherwise it is not transformed. */
#cam { display: flex; flex-direction: row; flex-wrap: wrap; align-content: flex-start; gap: 2.5cqh 2cqw;
       position: relative; min-height: 100%; transform-origin: 0 0; flex: 0 0 100%; width: 100%; }
/* flex 0 0 100%: the board area is a wrapping row (board style), so #cam was
   sized by what it held and every block's width changed with it (2026-09-26). */
/* a tight board (bundle 1.8), where its fullest state would not otherwise fit,
   on the whole board from its start so nothing moves: level 1 halves the gap
   between blocks, level 2 also halves the blocks' own vertical padding */
#cam.tight { row-gap: 1.2cqh; }
#cam.tight2 > .blk { padding-top: .9cqh; padding-bottom: .9cqh; }
#cam.tight2 > .blk.card, #cam.tight2 > .blk.tl, #cam.tight2 > .blk.cl, #cam.tight2 > .blk.tbl { padding-top: 0; padding-bottom: 0; }
#cam.tight2 .cardhd { padding-top: .5cqh; padding-bottom: .5cqh; }
#cam.tight2 .cardbd { padding-top: .9cqh; padding-bottom: .9cqh; }
#cam.tight2 .cl-piece { padding-top: .8cqh; padding-bottom: .8cqh; }
@media (prefers-reduced-motion: no-preference) {
  #cam.glide { transition: transform .6s cubic-bezier(.4, 0, .2, 1); }
  .dmap-grid.glide { transition: transform .6s cubic-bezier(.4, 0, .2, 1); }
}
/* A map board (bundle 1.14; ADR 026, Part A question method): the map of the
   four texts in the left column, the question and its notes beside it, in
   reading order. The camera never moves on a map board: the map has its own
   lens, so the question stays in view while the map zooms. */
#cam.mapboard { display: grid; grid-template-columns: 58% minmax(0, 1fr); grid-auto-rows: min-content;
                align-content: start; column-gap: 2cqw; row-gap: 1.5cqh; flex-wrap: nowrap; }
#cam.mapboard > .blk.dmap { grid-column: 1; grid-row: 1 / span 40; }
#cam.mapboard > .blk:not(.dmap) { grid-column: 2; width: auto; max-width: none; }
#cam.mapboard > .blk.beside { position: static; }
/* A Part B question board (bundle 1.16; ADR 026, 2026-10-08): two columns. The
   extract is a fixed page in the first, `split` per cent of the board's width,
   shown whole: no lens, no scrolling. The question and its notes are a column
   beside it; a gloss that does not fit there is drawn over that column's foot
   (a state's `overlay`), never over the extract. The camera never moves. */
#cam.qboard { flex-direction: column; flex-wrap: nowrap; align-content: normal; box-sizing: border-box;
              padding-left: calc(var(--split) + 2cqw); }
#cam.qboard > .blk { flex: 0 0 auto; }
#cam.qboard > .blk.qtext { position: absolute; left: 0; top: 0; width: var(--split); margin: 0; }
#cam.qboard > .blk.beside { position: static; }
#cam.qboard > .blk.over { position: absolute; right: 0; bottom: 0; width: calc(100% - var(--split) - 2cqw);
                          z-index: 4; }
/* A typed part of a table cell keeps its final size from the start: the part
   not yet typed is present but invisible, so the table never reflows. */
.tw-none, .tw-h { visibility: hidden; }
.typing .tw-s { position: relative; }
.typing .tw-s::after { content: ""; position: absolute; right: calc(-1 * max(2px, .25cqh)); top: .1em;
                       width: max(2px, .25cqh); height: 1em; background: #185FA5; }

/* Diagram parts are DRAWN, not shown (docs/02-DESIGN-SYSTEM.md §7a): each
   part appears at its own reveal cue and is drawn in motion, the way a
   teacher draws on a board. A part turned on after a seek, or long after its
   cue, carries .settled and appears complete with no replay. Every motion is
   well under a second so it never lags the speech. */
.pt { opacity: 0; }
.pt.on { opacity: 1; }
@keyframes draw-x { from { clip-path: inset(-3cqh 100% -3cqh 0); } to { clip-path: inset(-3cqh -3cqh -3cqh 0); } }
@keyframes draw-from-end { from { clip-path: inset(-2cqh 0 -2cqh 100%); } to { clip-path: inset(-2cqh 0 -2cqh -2.5cqh); } }
@keyframes write-in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes drop-in { from { transform: translateY(-1.5cqh); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop-x { from { opacity: 0; transform: translateX(-50%) scale(.4); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
@keyframes pop-tri { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes open-box { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@media (prefers-reduced-motion: no-preference) {
  .tl-arrow.on:not(.settled) .shaft { animation: draw-x .5s ease-out both; }
  .tl-arrow.on:not(.settled) .lab { animation: write-in .35s ease-out .3s both; }
  .tl-period.on:not(.settled) { animation: draw-x .5s ease-out both; }
  .tl-marker.on:not(.settled) .tick, .tl-now.on:not(.settled), .tl-point.on:not(.settled) i { animation: drop-in .25s ease-out both; }
  .tl-marker.on:not(.settled) .lab, .tl-now.on:not(.settled) span, .tl-point.on:not(.settled) span { animation: write-in .3s ease-out .15s both; }
  .tl-series.on:not(.settled) .x { animation: pop-x .18s ease-out both; animation-delay: calc(var(--i) * var(--step)); }
  .tl-legend.on:not(.settled) { animation: write-in .35s ease-out .3s both; }
  .tl-pointer.on:not(.settled) .lab { animation: write-in .3s ease-out both; }
  .tl-pointer.on:not(.settled) .pline { animation: draw-from-end .4s ease-out .15s both; }
  .tl-callout.on:not(.settled) .cobox { animation: open-box .3s ease-out both; transform-origin: var(--tri) 0; }
  .tl-callout.above.on:not(.settled) .cobox { transform-origin: var(--tri) 100%; }
  .tl-callout.on:not(.settled) .tri { animation: pop-tri .2s ease-out .25s both; }
  /* the clause diagram (ADR 010): a piece is drawn in, the glue takes its
     colour, and at the join the tab slides across the gap into the notch.
     Only the tab, its neck and colours move: no word does (§8a). */
  .cl-piece.on:not(.settled) { animation: write-in .45s ease-out both; }
  .cl-bridge.on:not(.settled) { animation: drop-in .25s ease-out both; }
  .cl-glue.on:not(.settled) { animation: glue-in .35s ease-out both; }
  .cl-w.on:not(.settled)::after { animation: fade-in .3s ease-out both; }
  .cl-row:has(.cl-join.on:not(.settled)) .cl-tab { animation: cl-tab .55s cubic-bezier(.4, 0, .2, 1) both; }
  .cl-row:has(.cl-join.on:not(.settled)) .cl-neck { animation: cl-neck .55s cubic-bezier(.4, 0, .2, 1) both; }
  /* ADR 012: the set-in clause takes its tint and edge, and the removal line
     is written in. A subject link's arc is redrawn on every render from where
     the words are, so it appears whole at its reveal. */
  .cl-emb.on:not(.settled) { animation: glue-in .4s ease-out both; }
  .cl-rm.on:not(.settled) { animation: write-in .45s ease-out both; }
  /* a gloss (ADR 013): its meaning and example are written in; its image
     (ADR 015) fades in */
  .gl-m.on:not(.settled), .gl-x.on:not(.settled) { animation: write-in .4s ease-out both; }
  .gl-pic.on:not(.settled) { animation: fade-in .5s ease-out both; }
}
@keyframes glue-in { from { background: transparent; box-shadow: 0 0 0 .35cqh transparent; } }
@keyframes cl-tab { from { transform: none; } }
@keyframes cl-neck { from { width: 0; } }
@keyframes fade-in { from { opacity: 0; } }

#contentsBtn { min-width: 44px; height: 100%; font: inherit; font-size: 2.4cqh; letter-spacing: .08em;
               text-transform: uppercase; color: #5F5E5A; background: none; border: none;
               border-left: 1px solid #E8E6DF; padding: 0 2.5cqw; cursor: pointer; }
#contents { position: absolute; left: 0; right: 0; top: 8cqh; bottom: max(8cqh, 44px);
            background: #fff; padding: 2.5cqh 5cqw; overflow: auto; display: none; box-sizing: border-box; }
#contents.on { display: block; }
#contents .lbl { margin-bottom: 1.5cqh; }
#contents ol { margin: 0; padding: 0; list-style: none; }
#contents li button { display: flex; gap: 2cqw; width: 100%; text-align: left; font: inherit; font-size: 3.2cqh;
                      line-height: 1.35; color: #2C2C2A; background: none; border: none;
                      border-bottom: 1px solid #E8E6DF; padding: 1.4cqh 0; min-height: 44px; cursor: pointer; }
#contents li button .n { color: #888780; min-width: 4cqw; font-variant-numeric: tabular-nums; }
#contents li button.here { color: #185FA5; }

/* Marks are drawn in an overlay layer, never inline (docs/02-DESIGN-SYSTEM.md
   §8a, 2026-09-26): the phrase is wrapped in a span that has no box and no
   decoration, so a mark never moves a word; #marks draws the ring, line or
   tint over each line fragment of the span, measured on every render. */
#marks { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
/* a word mark wrapped ahead of its time shows nothing until then */
.wm.wm-off { color: inherit !important; background: none !important; text-decoration: none !important; }
/* above everything on the board, side notes (z-index 3) included */
#marks > div { position: absolute; box-sizing: border-box; }
#marks .m-highlight { background: rgba(250, 199, 117, .6); mix-blend-mode: multiply; border-radius: .3cqh; }
/* keyword pairs, one colour a pair (ADR 026, bundle 1.13): drawn at 55% like a highlight */
#marks .m-match1 { background: rgba(6, 136, 249, .55); mix-blend-mode: multiply; border-radius: .3cqh; }
#marks .m-match2 { background: rgba(168, 96, 251, .55); mix-blend-mode: multiply; border-radius: .3cqh; }
#marks .m-match3 { background: rgba(249, 232, 6, .55); mix-blend-mode: multiply; border-radius: .3cqh; }
/* opinion-signal marks (ADR 026, Part C; bundle 1.17): an underline in the
   kind's colour, its pattern its own, with a small label above the words, so
   colour never carries the meaning alone; a subordinate clause is dimmed */
#marks .m-sig { border-radius: 1px; }
#marks .m-sig.sig_opinion { background: #2B006B; }
#marks .m-sig.sig_hedge { background: repeating-linear-gradient(90deg, #006B60 0 .9em, transparent .9em 1.25em); }
#marks .m-sig.sig_judge { background: repeating-linear-gradient(90deg, #6B0020 0 .35em, transparent .35em .6em); }
#marks .m-sig.sig_main { background: #6B4B00; }
#marks .m-sigtick { background: #6B4B00; }
#marks .m-aside { background: rgba(255, 255, 255, .55); }
#marks .m-siglab { white-space: nowrap; line-height: 1.15; color: #fff; padding: 0 .45em; border-radius: .7em;
                   font-weight: 500; letter-spacing: .01em; }
#marks .m-siglab.sig_opinion { background: #2B006B; } #marks .m-siglab.sig_hedge { background: #006B60; }
#marks .m-siglab.sig_judge { background: #6B0020; } #marks .m-siglab.sig_main { background: #6B4B00; }
#marks .m-line { background: #185FA5; border-radius: 1px; }
#marks .m-strike { background: #E24B4A; border-radius: 1px; }
#marks .m-circle { border: max(1px, .28cqh) solid #185FA5; border-radius: 999px; }
#marks .m-tick { background: #185FA5; }
#marks .m-with { white-space: nowrap; line-height: 1; color: #185FA5;
                 font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; }
.mk-arrow-from, .mk-arrow-to { }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 6; }
#overlay path { fill: none; stroke: #185FA5; stroke-linecap: round; }
#overlay .head { fill: #185FA5; }
#overlay path.cl-link { stroke: #475569; } #overlay .head.cl-link { fill: #475569; stroke: none; }
#overlay path.cl-link.dg { stroke: #888780; stroke-dasharray: 0; }
#overlay .cl-x { fill: #E24B4A; stroke: none; } #overlay .cl-x-mark { stroke: #fff; }
#pointer { position: absolute; width: 2.6cqh; height: 2.6cqh; border-radius: 50%;
           border: max(2px, .35cqh) solid #185FA5; background: rgba(24, 95, 165, .12);
           transform: translate(-50%, -50%); opacity: 0; pointer-events: none;
           transition: left .4s ease, top .4s ease, opacity .2s ease; z-index: 7; }
#pointer.on { opacity: 1; }

#playPause { width: max(6cqh, 44px); height: max(6cqh, 44px); border-radius: 50%; border: 1px solid #5F5E5A;
             background: #fff; color: #5F5E5A; font-size: 2.6cqh; cursor: pointer; flex: none; padding: 0; }
#scrubber { flex: 1; height: max(4cqh, 44px); margin: 0; accent-color: #5F5E5A; cursor: pointer; }
#timeLabel { font-variant-numeric: tabular-nums; flex: none; min-width: 12cqw; text-align: right; }

/* Review chrome, outside the frame: what is being said, and where we are. */
#review { width: var(--w); font-size: 13px; line-height: 1.45; display: flex; gap: 14px; align-items: baseline; }
#subtitle { flex: 1; min-height: 2.9em; padding: 7px 10px; background: #fff; border: 1px solid #e3e1d9; }
#subtitle .provenance { display: inline-block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
                        color: #888780; margin-right: 8px; }
#where { flex: none; color: #888780; font-variant-numeric: tabular-nums; }
#failure { color: #a11d1d; }
/* Silent preview: no audio, timing estimated from word counts. Marked so
   nobody mistakes it for the real lesson. */
#silentBanner { display: none; width: var(--w); box-sizing: border-box; margin-bottom: 8px; padding: 8px 12px;
                background: #FDF3DF; border: 1px solid #EF9F27; color: #412402; font-size: 13px; line-height: 1.4; }
#silentBanner b { letter-spacing: .08em; }
#silentTag { display: none; flex: none; font-size: 2cqh; letter-spacing: .1em; text-transform: uppercase;
             color: #854F0B; border: 1px solid #EF9F27; padding: .3cqh .8cqw; }
.silent #silentBanner { display: block; } .silent #silentTag { display: inline-block; }
/* 1.18 (ADR 029): while a recording of the practice set plays (an utterance of
   kind "exam"), the board says so: a label in the header and an outline round
   the board, drawn over nothing (box-shadow inside the board's own edge), so no
   word moves. Present only in a lesson that has recordings. */
#recTag { display: none; flex: none; align-items: center; gap: .6em; margin: 0 1.2cqw; padding: .25cqh 1.1cqw;
          border-radius: 999px; background: #185FA5; color: #fff; font-size: 2.2cqh; font-weight: 500;
          white-space: nowrap; }
#recTag::before { content: ""; width: .7em; height: .7em; border-radius: 50%; background: #fff; }
.frame.rec #recTag { display: inline-flex; }
.frame.rec .body { box-shadow: inset 0 0 0 max(2px, .4cqh) #185FA5; }
@media (prefers-reduced-motion: no-preference) {
  .frame.rec #recTag::before { animation: recpulse 1.4s ease-in-out infinite; }
}
@keyframes recpulse { 50% { opacity: .35; } }
/* 1.19 (ADR 030): a Listening board, one layout for Parts A, B and C. The
   transcript is a box of fixed size and fixed type in the first column, `split`
   per cent of the board's width; the questions (Part A's note form, a Part B or
   C question and its options) and the notes are a column beside it. The box
   shows `lines` lines; while a recording plays it moves line by line, smoothly,
   keeping the line being said about the fourth from its top, a thin line under
   the word being said and a small caret in its left margin at that line. No
   word is recoloured or highlighted; nothing in the box is ever cut: its lines
   are on one grid (no space between rows) and it moves by whole lines. The
   camera never moves on these boards. */
#cam.lboard { flex-direction: column; flex-wrap: nowrap; align-content: normal; box-sizing: border-box;
              padding-left: calc(var(--lsplit) + 2cqw); }
#cam.lboard > .blk { flex: 0 0 auto; }
#cam.lboard > .blk.ltext { position: absolute; left: 0; top: 0; width: var(--lsplit); margin: 0; }
#cam.lboard > .blk.beside { position: static; }
#cam.lboard > .blk.lsec { order: -1; }
#cam.lboard > .blk.lsec-off { display: none; }
#cam .ltext table.lt-head { margin: 0; }
#cam .ltext .lt-win { position: relative; overflow: hidden; height: calc(var(--llines) * var(--llh)); }
#cam .ltext .lt-scr { position: relative; }
#cam .ltext .lt-scr > table { margin: 0; }
#cam .ltext .lt-scr td { font-size: var(--lfs); line-height: var(--llh); padding: 0 1.4cqw 0 calc(1.4cqw + 1.1em);
                    text-align: justify; text-align-last: left; }
#cam .ltext.hyph .lt-scr td { hyphens: auto; -webkit-hyphens: auto; }
#cam .ltext .lt-mk { position: absolute; left: 0; top: 0; width: 0; height: max(2px, .32cqh); border-radius: 1px;
                background: #185FA5; opacity: 0; pointer-events: none; }
#cam .ltext .lt-caret { position: absolute; left: calc(1.4cqw + .15em); top: 0; width: 0; height: 0; opacity: 0;
                   border-left: .55em solid #185FA5; border-top: .32em solid transparent;
                   border-bottom: .32em solid transparent; font-size: var(--lfs); pointer-events: none; }
#cam .ltext .lt-mk.on, #cam .ltext .lt-caret.on { opacity: 1; }
/* a Part A note form on a Listening board: its type fixed, its rows in a window
   that shows whole rows only (a row partly outside is not drawn) and moves to
   the heading being heard, or to the gap being filled */
#cam .lform .lt-win { position: relative; overflow: hidden; height: var(--lfh); }
#cam .lform .lt-scr { position: relative; }
#cam .lform .lt-scr > table, #cam .lform table.lt-head { margin: 0; }
#cam .lform tr.lt-out, #cam .lform tr.lt-out * { visibility: hidden !important; }
@media (prefers-reduced-motion: no-preference) {
  #cam .lform .lt-scr.glide { transition: transform .45s cubic-bezier(.4, 0, .2, 1); }
}
@media (prefers-reduced-motion: no-preference) {
  #cam .ltext .lt-scr.glide { transition: transform .45s cubic-bezier(.4, 0, .2, 1); }
  #cam .ltext .lt-mk.glide { transition: left .14s linear, width .14s linear; }
}
/* 1.20 (ADR 031): the vocabulary panel, in the transcript's column under its
   box: each item its word, a button that plays the sentence it is said in, its
   meaning, its synonyms and an example, at a fixed size (never below the
   floor); only whole items are shown, the newest last, and an item that does
   not fit is not drawn. While a recording plays, the items the marker has
   passed; otherwise the items the narration is teaching. */
#cam .lpanel { position: absolute; left: 0; top: 0; width: var(--lsplit); height: 0; overflow: hidden;
               display: flex; flex-direction: column; gap: 1cqh; font-size: var(--lpf); }
#cam .lpanel > .blk { position: static; margin: 0; flex: 0 0 auto; max-width: 100%; }
#cam .lpanel > .blk.lpan-off { display: none; }
#cam .lpanel .blk.gl.lvoc { padding: .6cqh 1.4cqw; font-size: var(--lpf); line-height: 1.3; }
#cam .lpanel .lvoc .gl-txt { display: block; }
#cam .lpanel .lvoc .gl-h, #cam .lpanel .lvoc .gl-w, #cam .lpanel .lvoc .gl-x,
#cam .lpanel .lvoc .gl-s { font-size: var(--lpf); line-height: 1.3; margin: 0; color: inherit; }
/* the word, its meaning and its synonyms flow as one paragraph; the example under them */
#cam .lpanel .lvoc .gl-h, #cam .lpanel .lvoc .gl-s { display: inline; }
#cam .lpanel .lvoc .gl-x { display: block; }
#cam .lpanel .lvoc .gl-w { font-weight: 600; }
#cam .lpanel .lvoc .gl-s::before { content: " \00B7  Similar: "; color: #5F5E5A; }
#cam .lpanel .lvoc.lv-pair .gl-s::before { content: " \00B7  Same as: "; }
#cam .lpanel .lvoc .gl-x::before { font-size: var(--lpf); color: #5F5E5A; }
#cam .lpanel .lvoc .gl-heard, #cam .lpanel .lvoc .gl-say { width: calc(var(--lpf) * 1.15); height: calc(var(--lpf) * 1.15); }
/* the note form whole, the width of the board, while the reading time before a
   Part A extract plays (1.20, ADR 031); the transcript and the notes wait */
#cam.lboard.lread { padding-left: 0; }
#cam.lboard.lread > .blk:not(.lform), #cam.lboard.lread .lpanel { display: none; }
#cam.lboard.lread > .blk.lform { width: 100%; }
#cam.lboard.lread .lform .lt-win { height: auto; }

/* Style C (bundle 1.22, ADR 042): the look is the lesson's blocks.css; these
   are the looks of what the player draws, and its motion (rules 53 to 55). A
   highlight is a marker band under the words, in a light amber, the lower 38%
   of the line; a strike is drawn in the red of "wrong"; both are drawn in from
   left to right (positionMarks). The band is multiplied with what is under it,
   so the letters stay as dark as they are and only their ground takes the
   amber: the marks' layer forms no stacking context of its own in style C (a
   layer with a z-index is a group of its own, and its band was laid flat over
   the glyphs, 2026-10-26); each mark keeps its place above the side notes by
   its own z-index. A note that goes, by an erase or a clear, fades and
   shrinks; a cleared note's room closes up as it goes, instead of jumping. */
.frame.style-c #marks { z-index: auto; }

      pf = next; w = w2;

  // size found is kept: after three steps that bring nothing closer (what does
  // not fit is at its floor; a measure in whole pixels can stand still a step)

  drawParts(bd, s && !erased ? s : null, t, jumped);

  const u = utteranceAt(t);

  }
  if (u && u.kind === "exam" && !state.failure) {

    subtitleEl.appendChild(document.createTextNode((u.exam.label || u.exam.stimulus) + ", " + u.exam.span));
  } else if (u && !state.failure) {

const PRACTICE = [];
for (const bd of boards) for (const s of bd.states) for (const p of (s.practice || [])) PRACTICE.push(p);
PRACTICE.sort((a, b) => a.time - b.time);
const ppDone = new Map();                 // point id -> what was answered, so a replay shows it
window.__practiceAttempts = [];
let ppOpen = null;
function ppEsc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
// the site's inline text: **bold** and ~~struck~~ only (ADR-0031 §6)
function ppInline(s) { return ppEsc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/~~(.+?)~~/g, "<s>$1</s>"); }
function ppEl(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
// Marking schemes. oet-typed-v1 is the site's (its normalisation, ported); oet-typed-form-v1 is
// proposed with ADR 046 for writing practice, where the form is what is taught: it keeps hyphens,
// articles and every word, and only ignores case, curly quotes, extra spaces and a final mark.
const PP_NUM = { one: "1", two: "2", three: "3", four: "4", five: "5", six: "6", seven: "7", eight: "8", nine: "9", ten: "10",
                 eleven: "11", twelve: "12", twenty: "20", thirty: "30", forty: "40", fifty: "50", hundred: "100" };
function ppNorm(s, scheme) {
  s = String(s).toLowerCase().replace(/[‘’ʼ]/g, "'").replace(/[–—]/g, "-");
  if (scheme === "oet-typed-form-v1")
    return s.replace(/\s+/g, " ").trim().replace(/[.,;:!]+$/, "").trim();
  s = s.replace(/ae/g, "e").replace(/[-/]/g, " ").replace(/[^a-z0-9%' ]/g, " ");

  if (w.length > 1 && ["a", "an", "the"].includes(w[0])) w = w.slice(1);

}
function ppExpand(form) {                 // round brackets: optional words, both ways
  const m = /\(([^()]*)\)/.exec(form);
  if (!m) return [form.replace(/\s+/g, " ").trim()];
  const a = form.slice(0, m.index), b = form.slice(m.index + m[0].length);
  return [...ppExpand(a + m[1] + b), ...ppExpand(a + b)];
}
function ppTyped(unit, given) {
  const sc = unit.scoring.marking_scheme, g = ppNorm(given, sc);
  const right = g !== "" && unit.scoring.accepted.some(f => ppExpand(f).some(x => ppNorm(x, sc) === g));
  let why = null;
  if (!right) for (const w of unit.feedback.wrong_answers) if (ppExpand(w.answer).some(x => ppNorm(x, sc) === g)) { why = w; break; }
  return { right, why, key: unit.scoring.accepted[0], reason: unit.feedback.key };
}
function ppFeedback(r) {
  const fb = ppEl("div", "pp-fb " + (r.right ? "ok" : "no"));
  fb.setAttribute("role", "status");
  fb.innerHTML = (r.right ? '<span class="mk">&#10003; Right.</span>' : '<span class="mk">&#10007; Not quite.</span>')
    + (r.right ? "" : (r.why ? ppInline(r.why.why_wrong) + " " : "")
       + '<span class="ans">Answer: ' + ppInline(r.key) + "</span>")
    + ppInline(r.reason);

}
// One renderer per item type: el, ready(), check() -> [{unit, answer, right}], show(), restore(saved)
function ppText(it, onChange) {
  const el = ppEl("div", "pp-item");
  const big = it.response && it.response.size === "sentence";
  let inp;
  if (big) {
    el.appendChild(ppEl("p", "pr", ppInline(it.prompt)));
    inp = ppEl("textarea", "pp-in");
    inp.rows = 3;
    el.appendChild(inp);
  } else {
    const line = ppEl("p", "pp-line");
    const parts = it.prompt.split("____");
    line.innerHTML = ppInline(parts[0]);
    inp = ppEl("input", "pp-in"); inp.type = "text";
    line.appendChild(inp);
    if (parts.length > 1) line.insertAdjacentHTML("beforeend", ppInline(parts.slice(1).join("____")));
    el.appendChild(line);
  }

    check: () => { res = ppTyped(it, inp.value); inp.disabled = true;
                   return [{ unit: it.item_id, version: it.version, answer: { text: inp.value }, right: res.right }]; },
    show: (withCheck) => { if (!withCheck) el.appendChild(ppFeedback(res)); },
    restore: s => { inp.value = s[0].answer.text; } };
}
function ppGapfill(it, onChange) {
  const el = ppEl("div", "pp-item");
  if (it.title) el.appendChild(ppEl("p", "pr", ppInline(it.title)));
  const ins = [], rows = [];
  for (const g of it.gaps) {
    const line = ppEl("p", "pp-line");
    const parts = g.prompt.split("____");
    line.innerHTML = ppInline(parts[0]);
    const inp = ppEl("input", "pp-in"); inp.type = "text";
    Object.assign(inp, { autocomplete: "off", spellcheck: false });
    inp.setAttribute("autocapitalize", "off");
    inp.setAttribute("aria-label", "Gap " + g.number + ": " + g.prompt.replace(/\*\*/g, ""));
    inp.addEventListener("input", onChange);
    line.appendChild(inp);
    line.insertAdjacentHTML("beforeend", ppInline(parts.slice(1).join("____")));
    const wrap = ppEl("div"); wrap.appendChild(line); el.appendChild(wrap);
    ins.push(inp); rows.push(wrap);
  }
  let res = [];
  return { el, first: ins[0], ready: () => ins.every(i => i.value.trim() !== ""),
    check: () => { res = it.gaps.map((g, i) => ppTyped(g, ins[i].value)); ins.forEach(i => { i.disabled = true; });
                   return it.gaps.map((g, i) => ({ unit: g.gap_id, version: it.version, answer: { text: ins[i].value }, right: res[i].right })); },
    show: () => rows.forEach((w, i) => w.appendChild(ppFeedback(res[i]))),
    restore: s => s.forEach((x, i) => { ins[i].value = x.answer.text; }) };
}
function ppOptionText(it, id) { const o = it.options.find(x => x.option_id === id); return o ? o.text : id; }
function ppChoice(it, onChange) {
  const el = ppEl("div", "pp-item");
  el.appendChild(ppEl("p", "pr", ppInline(it.stem)));
  const box = ppEl("div", "pp-opts"); box.setAttribute("role", "radiogroup");
  let chosen = null; const btns = [];
  for (const id of it.display_order) {
    const b = ppEl("button", "pp-btn", ppInline(ppOptionText(it, id)));
    b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", "false");
    b.addEventListener("click", () => { chosen = id; btns.forEach(x => x.setAttribute("aria-checked", String(x === b))); onChange(); });
    btns.push(b); box.appendChild(b);
  }
  el.appendChild(box);
  let right = false;
  return { el, first: btns[0], ready: () => chosen !== null,
    check: () => { right = chosen === it.scoring.key_option_id; btns.forEach(b => { b.disabled = true; });
                   return [{ unit: it.item_id, version: it.version, answer: { option_id: chosen }, right }]; },
    show: () => { const w = it.feedback.options[chosen];
                  el.appendChild(ppFeedback({ right, why: w || null, key: ppOptionText(it, it.scoring.key_option_id), reason: it.feedback.key })); },
    restore: s => { chosen = s[0].answer.option_id; btns.forEach((b, i) => b.setAttribute("aria-checked", String(it.display_order[i] === chosen))); } };
}
function ppWordbank(it, onChange) {
  const el = ppEl("div", "pp-item");
  if (it.title) el.appendChild(ppEl("p", "pr", ppInline(it.title)));
  const bank = ppEl("div", "pp-bank"); bank.setAttribute("aria-label", "Words");
  const placed = it.gaps.map(() => null); const slots = []; const chips = new Map(); const rows = [];
  let active = 0;
  const sync = () => {
    slots.forEach((s, i) => { s.textContent = placed[i] ? ppOptionText(it, placed[i]) : "tap a word";
                              s.classList.toggle("full", !!placed[i]); s.classList.toggle("sel", i === active); });
    if (!it.reuse_options) for (const [id, c] of chips) c.disabled = placed.includes(id) || c.dataset.locked === "1";
    onChange();
  };
  it.gaps.forEach((g, i) => {
    const line = ppEl("p", "pp-line");
    const parts = g.prompt.split("____");
    line.innerHTML = ppInline(parts[0]);
    const s = ppEl("button", "pp-slot"); s.type = "button"; s.setAttribute("aria-label", "Gap " + g.number);
    s.addEventListener("click", () => { if (placed[i]) placed[i] = null; active = i; sync(); });
    line.appendChild(s); line.insertAdjacentHTML("beforeend", ppInline(parts.slice(1).join("____")));
    const wrap = ppEl("div"); wrap.appendChild(line); rows.push(wrap); slots.push(s);
  });
  for (const id of it.display_order) {
    const c = ppEl("button", "pp-chip", ppInline(ppOptionText(it, id))); c.type = "button";
    c.addEventListener("click", () => {
      let i = placed[active] == null ? active : placed.findIndex(x => x == null);
      if (i < 0) i = active;
      placed[i] = id;
      const nxt = placed.findIndex(x => x == null); active = nxt < 0 ? i : nxt; sync();
    });
    chips.set(id, c); bank.appendChild(c);
  }
  el.appendChild(bank); rows.forEach(r => el.appendChild(r));
  sync();
  let res = [];
  return { el, first: [...chips.values()][0], ready: () => placed.every(Boolean),
    check: () => { res = it.gaps.map((g, i) => ({ right: placed[i] === g.scoring.key_option_id, why: g.feedback.options[placed[i]] || null,
                                                  key: ppOptionText(it, g.scoring.key_option_id), reason: g.feedback.key }));
                   [...slots, ...chips.values()].forEach(b => { b.disabled = true; b.dataset.locked = "1"; }); active = -1;
                   slots.forEach(s => s.classList.remove("sel"));
                   return it.gaps.map((g, i) => ({ unit: g.gap_id, version: it.version, answer: { option_id: placed[i] }, right: res[i].right })); },
    show: () => rows.forEach((w, i) => w.appendChild(ppFeedback(res[i]))),
    restore: s => { s.forEach((x, i) => { placed[i] = x.answer.option_id; }); sync(); } };
}
function ppOrdering(it, onChange) {
  const el = ppEl("div", "pp-item");
  el.appendChild(ppEl("p", "pr", ppInline(it.stem)));
  const built = ppEl("div", "pp-built"); built.dataset.empty = "Tap the pieces in order";
  const pool = ppEl("div", "pp-pool");
  const order = []; const chips = new Map();
  const sync = () => {
    built.innerHTML = "";
    for (const id of order) {
      const b = ppEl("button", "pp-chip sel", ppInline(ppOptionText(it, id))); b.type = "button";
      b.setAttribute("aria-label", ppOptionText(it, id) + ", placed; tap to take it back");
      b.addEventListener("click", () => { if (lock) return; order.splice(order.indexOf(id), 1); sync(); });
      b.disabled = lock; built.appendChild(b);
    }
    for (const [id, c] of chips) c.disabled = lock || order.includes(id);
    onChange();
  };
  let lock = false;
  for (const id of it.display_order) {
    const c = ppEl("button", "pp-chip", ppInline(ppOptionText(it, id))); c.type = "button";
    c.addEventListener("click", () => { order.push(id); sync(); });
    chips.set(id, c); pool.appendChild(c);
  }
  el.appendChild(built); el.appendChild(pool);
  let score = 0;
  const same = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  return { el, first: [...chips.values()][0], ready: () => order.length === it.options.length,
    check: () => {
      const acc = it.scoring.accepted_orders;
      if (it.scoring.method === "adjacent-pairs") {
        score = Math.max(...acc.map(a => { let k = 0; for (let i = 0; i + 1 < order.length; i++) { const j = a.indexOf(order[i]); if (a[j + 1] === order[i + 1]) k++; } return k / (order.length - 1); }));
      } else score = acc.some(a => same(a, order)) ? 1 : 0;
      lock = true; sync();
      return [{ unit: it.item_id, version: it.version, answer: { order: order.slice() }, right: score === 1, score }]; },
    show: () => { const w = it.feedback.wrong_orders.find(x => same(x.order, order));
                  el.appendChild(ppFeedback({ right: score === 1, why: w || null,
                                              key: it.scoring.accepted_orders[0].map(id => ppOptionText(it, id)).join(" "), reason: it.feedback.key })); },
    restore: s => { order.splice(0, order.length, ...s[0].answer.order); sync(); } };
}
const PP_TYPES = { text: ppText, gapfill: ppGapfill, choice: ppChoice, wordbank: ppWordbank, ordering: ppOrdering };
// a sentence's self-check list (ADR 046): the learner's sentence beside the model, the key points ticked
function ppCheckList(p, given, saved) {
  const box = ppEl("div", "pp-item");
  const m = ppEl("div", "pp-model");
  m.innerHTML = '<div class="box yours"><span class="lab">Your sentence</span>' + ppEsc(given) + "</div>"
    + '<div class="box ours"><span class="lab">The model</span>' + ppInline(p.check.model) + "</div>";
  box.appendChild(m);
  box.appendChild(ppEl("p", "pr", "<b>Tick what you got.</b>"));
  const ul = ppEl("ul", "pp-list");
  const ticks = [];
  for (const pt of p.check.points) {
    const li = ppEl("li"); const lab = ppEl("label"); const cb = ppEl("input"); cb.type = "checkbox";
    cb.checked = !!(saved && saved.includes(pt.id));
    cb.addEventListener("change", () => { const d = ppDone.get(p.id); if (d) d.ticked = ticks.filter(t => t.cb.checked).map(t => t.id); });
    lab.appendChild(cb); lab.insertAdjacentHTML("beforeend", "<span>" + ppInline(pt.text) + "</span>");
    li.appendChild(lab); ul.appendChild(li); ticks.push({ id: pt.id, cb });
  }
  box.appendChild(ul);
  return box;
}
function ppSheet(ex) {
  const s = ppEl("section", "pp-sheet"); s.setAttribute("aria-label", ex.title || "From the paper");
  s.appendChild(ppEl("div", "cap", ppEsc(ex.title || "From the paper")));
  const tb = ppEl("table");
  for (const r of ex.rows) {
    const tr = ppEl("tr", r.lines.length ? "" : "h");
    tr.innerHTML = '<td class="l">' + ppEsc(r.label || "") + "</td><td>" + r.lines.map(l => '<span class="ln">' + ppEsc(l) + "</span>").join("") + "</td>";
    tb.appendChild(tr);
  }
  s.appendChild(tb);
  return s;
}
function openPractice(p) {
  const done = ppDone.get(p.id);
  const layer = ppEl("div", "pp-layer"); layer.id = "ppLayer";
  const card = ppEl("div", "pp-card");
  card.setAttribute("role", "dialog"); card.setAttribute("aria-modal", "true"); card.setAttribute("aria-labelledby", "ppTask");
  const head = ppEl("div", "pp-head", '<span class="pp-tag">Your turn</span>');
  const task = ppEl("p", "pp-task", ppInline(p.task)); task.id = "ppTask"; head.appendChild(task);
  const body = ppEl("div", "pp-body");
  body.appendChild(ppSheet(p.excerpt));
  const work = ppEl("section", "pp-work"); work.setAttribute("aria-label", "Your answer");
  const actions = ppEl("div", "pp-actions");
  const checkBtn = ppEl("button", "pp-go alt", "Check"); checkBtn.type = "button";
  const contBtn = ppEl("button", "pp-go", "Continue"); contBtn.type = "button"; contBtn.disabled = true;
  const hint = ppEl("p", "pp-hint", "Answer first, then Check. There is no second try.");
  let views = [];               // a widget may report a change while it is being built
  views = p.items.map(it => PP_TYPES[it.type](it, () => {
    checkBtn.disabled = !(views.length === p.items.length && views.every(v => v.ready())); }));
  views.forEach(v => work.appendChild(v.el));
  const sentence = p.check ? p.items.findIndex(it => it.type === "text" && it.response && it.response.size === "sentence") : -1;
  const reveal = (rec) => {
    views.forEach((v, i) => v.show(i === sentence));
    if (sentence >= 0) work.insertBefore(ppCheckList(p, rec[sentence][0].answer.text, ppDone.get(p.id).ticked), actions);
    checkBtn.disabled = true; checkBtn.hidden = true; contBtn.disabled = false; hint.remove(); contBtn.focus();
  };
  checkBtn.addEventListener("click", () => {
    if (!views.every(v => v.ready())) return;
    const rec = views.map(v => v.check());
    ppDone.set(p.id, { rec, ticked: [] });
    const at = new Date().toISOString();
    rec.forEach((units, i) => units.forEach(u => window.__practiceAttempts.push({
      practice_point: p.id, item: p.items[i].item_id, unit: u.unit, unit_version: u.version, answer: u.answer,
      auto_score: i === sentence && !u.right ? null : (u.score != null ? u.score : (u.right ? 1 : 0)),
      auto_result: i === sentence && !u.right ? "pending" : (u.right ? "correct" : (u.score > 0 ? "partial" : "wrong")), at })));
    reveal(rec);
  });
  contBtn.addEventListener("click", () => {
    const d = ppDone.get(p.id);
    if (p.check && d && !d.logged) {     // the self-check list: what the learner ticked, as said
      d.logged = true;
      window.__practiceAttempts.push({ practice_point: p.id, check: d.ticked.slice(), at: new Date().toISOString() });
    }
    closePractice(p);
  });

  work.appendChild(actions); work.appendChild(hint);
  body.appendChild(work);
  card.appendChild(head); card.appendChild(body); layer.appendChild(card);
  document.body.appendChild(layer); document.body.classList.add("pp-open");
  ppOpen = { p, layer };
  if (done) { views.forEach((v, i) => { v.restore(done.rec[i]); v.check(); }); reveal(done.rec); }
  else { checkBtn.disabled = true; (views[0].first || checkBtn).focus(); }
}
function closePractice(p) {
  if (!ppOpen) return;
  ppOpen.layer.remove(); document.body.classList.remove("pp-open"); ppOpen = null;
  seek(p.resume); play();
}
// rule 56: reached in play, never by a seek
function practiceTick(t0) {
  if (ppOpen || !state.playing) return;
  const t = state.globalTime;
  const p = PRACTICE.find(x => t0 < x.time - 1e-6 && t >= x.time - 1e-3);
  if (!p) return;
  pause(); seek(p.time); openPractice(p);
}
window.__openPractice = id => { const p = PRACTICE.find(x => x.id === id); if (p) { pause(); seek(p.time); openPractice(p); } };

if (window.__measureCopy) {
  window.__boards = boards;          // the copy that measures ahead draws nothing on its own
} else {
  const startAt = parseFloat(new URLSearchParams(location.search).get("t") || "0");
  seek(isFinite(startAt) ? startAt : 0);
  // Any change to the frame's size re-renders, so measured positions never go
  // stale: a window resize, fullscreen, or a headless viewport settling late.
  new ResizeObserver(() => { fit(); renderFrame(state.globalTime); }).observe(document.body);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { guardReset(); renderFrame(state.globalTime); aheadStart(); });
  else aheadStart();
  requestAnimationFrame(tick);
}
